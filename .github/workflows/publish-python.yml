name: Publish python3-hello

on:
  push:
    branches: [ main ]
    paths:
      - 'python3-hello/**'
      - '.github/workflows/publish-python.yml'
  workflow_dispatch:

jobs:
  build-test-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/${{ github.repository }}/python3-hello
    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Build image locally
        uses: docker/build-push-action@v5
        with:
          context: ./python3-hello
          load: true
          tags: python3-hello:test

      - name: Smoke test the image
        run: |
          output=$(docker run --rm python3-hello:test)
          echo "Container output: $output"
          [ "$output" = "Hello from Unikraft!" ]

      - name: Authenticate with GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push to GHCR
        uses: docker/build-push-action@v5
        with:
          context: ./python3-hello
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
